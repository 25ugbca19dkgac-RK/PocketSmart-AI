{% extends "base.html" %}
{% block title %}Register – PocketSmart AI{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Start planning your budgets smarter with AI</p>

        {% if error %}
        <div class="auth-error">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register" id="registerForm">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" 
                       placeholder="Choose a username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" 
                       placeholder="Enter your email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" 
                       placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
